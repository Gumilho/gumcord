<!doctype html>
<html lang="en" style="background: #1a1b2e">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gumcord</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1b2e; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #1a1b2e;
        color: #6b7290;
        font: 600 13px system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: opacity 0.25s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash .mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #5b40c2;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        letter-spacing: 0;
        text-transform: none;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.75; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .mark { animation: none; }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash" role="status" aria-label="Loading Gumcord">
      <div class="mark">G</div>
      <span>Loading</span>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
