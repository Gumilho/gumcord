<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Installable on phones (Add to Home Screen): opens fullscreen, without browser bars. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1b2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gumcord" />
    <!-- Nothing the app loads or links to learns it came from here. X's video server also refuses
         requests from other sites' pages. (YouTube's frame asks for our origin itself.) -->
    <meta name="referrer" content="no-referrer" />
    <title>Gumcord</title>
    <!-- Global styles live here (not in a component) so they apply before the app bundle loads. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      /* Scrolling boxes (the message box, the chat) would otherwise hand a sideways swipe on to the
         browser's back gesture; see the note on html, body. */
      * { overscroll-behavior-x: none; }
      /* Phones: sideways swipes switch panes, so the browser only pans vertically (and zooms) and
         can't turn one into its own back gesture. Set on every element because each scrolling box
         starts its own; the call's side-scrolling strip opts back in. */
      @media (max-width: 768px) {
        * { touch-action: pan-y pinch-zoom; }
      }
      html, body {
        height: 100%;
        margin: 0;
        background: #1a1b2e;
        color: #d4d8f0;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        /* No swipe-to-go-back or pull-to-refresh: sideways swipes switch panes on phones, and a
           reload would drop the call. */
        overscroll-behavior: none;
      }

      /* Created by the tooltip action on <body>, outside any component. */
      .gc-tooltip {
        position: fixed;
        z-index: 1000;
        padding: 6px 10px;
        border-radius: 6px;
        background: #0f1020;
        color: #e4e6f5;
        font: 600 13px system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        box-shadow: 0 4px 14px #0008;
      }
      .gc-tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: var(--arrow-x, 50%);
        transform: translateX(-50%);
        border: 5px solid transparent;
        border-top-color: #0f1020;
      }
      .gc-tooltip.below::after {
        top: auto;
        bottom: 100%;
        border-top-color: transparent;
        border-bottom-color: #0f1020;
      }

      /* Shared by the sidebar member list and call-view stream tiles. */
      .live-badge {
        flex-shrink: 0;
        padding: 1px 5px;
        border-radius: 3px;
        background: #d83c3e;
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
        line-height: 14px;
      }

      /* Scrollbars: rounded thumb floating in a transparent track. The transparent border insets the thumb. */
      ::-webkit-scrollbar { width: 14px; height: 14px; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
      ::-webkit-scrollbar-thumb {
        min-height: 40px;
        border: 4px solid transparent;
        border-radius: 8px;
        background: #33365a padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background-color: #43477a; }
      ::-webkit-scrollbar-thumb:active { background-color: #5b40c2; }
      /* Firefox has no ::-webkit-scrollbar. Chrome would drop the rules above if these applied there too. */
      @supports not selector(::-webkit-scrollbar) {
        * { scrollbar-width: thin; scrollbar-color: #33365a transparent; }
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #1a1b2e;
        color: #6b7290;
        font: 600 13px system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: opacity 0.25s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash .stuck { display: none; flex-direction: column; align-items: center; gap: 12px; text-transform: none; letter-spacing: 0; font-weight: 500; }
      #splash.is-stuck .stuck { display: flex; }
      #splash .stuck button {
        padding: 7px 18px;
        border: none;
        border-radius: 6px;
        background: #5b40c2;
        color: #fff;
        font: 600 13px system-ui, sans-serif;
        cursor: pointer;
      }
      #splash .mark {
        width: 64px;
        height: 64px;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.75; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .mark { animation: none; }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash" role="status" aria-label="Loading Gumcord">
      <img class="mark" src="%sveltekit.assets%/icon.svg" alt="" />
      <span>Loading</span>
      <div class="stuck">
        <span>This is taking longer than it should. Check the console for errors.</span>
        <button type="button" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <script>
      // Failsafe independent of the app bundle: if startup never finishes, say so instead of spinning forever.
      setTimeout(function () {
        var s = document.getElementById("splash");
        if (s && !s.classList.contains("hidden")) s.classList.add("is-stuck");
      }, 15000);
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
