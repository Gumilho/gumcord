# Production: `docker compose up -d --build`. Development only needs LiveKit: `docker compose up -d livekit`.
services:
  gumcord:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # LiveKit runs on the host network; the backend asks it who is in each voice channel.
      LIVEKIT_API_URL: http://host.docker.internal:7880
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8089:8080"
    volumes:
      - ./data:/data # database, uploads and session key: back this folder up

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    user: "1000:1000"
    # Host networking, as LiveKit recommends: media ports 7881/tcp and 7882/udp without Docker's NAT in the way.
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
